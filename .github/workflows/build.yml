name: Build & Upload Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Locale bundles and the manifest copy are build inputs: a missing key,
      # a placeholder mismatch, a hardcoded label or a stale `_locales` tree
      # must fail here instead of shipping.
      - run: npm run compile
      - run: npm run i18n:check
      - run: npm run i18n:scan
      - run: npm run i18n:manifest -- --check
      - run: npm test

      - run: npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: lumo-userscript-manager-chrome-mv3
          path: .output/chrome-mv3/
          if-no-files-found: error
          include-hidden-files: true
